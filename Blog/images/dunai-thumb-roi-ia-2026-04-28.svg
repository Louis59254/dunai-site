<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#EA580C" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Fond noir -->
  <rect width="1200" height="630" fill="#0C0A09"/>

  <!-- Glow radial flamme -->
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Motif points -->
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Barre verticale flamme à gauche -->
  <rect x="0" y="0" width="8" height="630" fill="#EA580C"/>
<!-- Catégorie -->
  <text x="52" y="68" font-family="'DM Sans', Arial, sans-serif" font-size="18" font-weight="500"
        fill="#F97316" letter-spacing="2">
    ROI &amp; MESURE · IA ENTREPRISE
  </text>

  <!-- Titre principal -->
  <text x="52" y="120" font-family="'Plus Jakarta Sans', Arial Black, sans-serif"
        font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-2">
    Mesurer le vrai ROI
  </text>
  <text x="52" y="195" font-family="'Plus Jakarta Sans', Arial Black, sans-serif"
        font-size="58" font-weight="800" letter-spacing="-2">
    <tspan fill="#ffffff">de l'</tspan><tspan fill="#EA580C">IA</tspan><tspan fill="#ffffff"> en entreprise</tspan>
  </text>

  <!-- Sous-titre -->
  <text x="52" y="265" font-family="'DM Sans', Arial, sans-serif" font-size="24" font-weight="300"
        fill="rgba(255,255,255,0.65)" letter-spacing="-0.3">
    Guide pratique : calcul, indicateurs et preuves concrètes
  </text>

  <!-- Séparateur bas -->
  <line x1="52" y1="330" x2="600" y2="330" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Stats -->
  <text x="52" y="490" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="32" font-weight="800" fill="#EA580C">×4</text>
  <text x="52" y="520" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">ROI sur 12 mois</text>

  <text x="180" y="490" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="32" font-weight="800" fill="#EA580C">6 sem.</text>
  <text x="180" y="520" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">avant premiers gains</text>

  <text x="360" y="490" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="32" font-weight="800" fill="#EA580C">-73%</text>
  <text x="360" y="520" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">tâches répétitives</text>

  <!-- URL dunai.fr en bas à droite -->
  <text x="1148" y="590" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="600"
        fill="rgba(255,255,255,0.35)" text-anchor="end">dunai.fr</text>

  <!-- Élément décoratif cercle flamme bas droite -->
  <circle cx="1100" cy="420" r="180" fill="#EA580C" opacity="0.06"/>
  <circle cx="1100" cy="420" r="120" fill="#EA580C" opacity="0.06"/>
  <circle cx="1100" cy="420" r="60" fill="#EA580C" opacity="0.08"/>
</svg>
