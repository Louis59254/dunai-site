<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#EA580C" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#0C0A09"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="630" fill="#EA580C"/>
  <!-- Logo Dunai en haut a gauche -->
  <text x="52" y="72" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="36" font-weight="800" letter-spacing="-1">
    <tspan fill="#ffffff">Dun</tspan><tspan fill="#EA580C">ai</tspan>
  </text>
  <line x1="52" y1="90" x2="320" y2="90" stroke="#EA580C" stroke-width="2" opacity="0.4"/>
  <text x="52" y="130" font-family="'DM Sans', Arial, sans-serif" font-size="18" font-weight="500" fill="#F97316" letter-spacing="2">ADOPTION IA · PME DU NORD</text>
  <text x="52" y="198" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="52" font-weight="800" letter-spacing="-2"><tspan fill="#ffffff">Pourquoi les PME du Nord</tspan></text>
  <text x="52" y="266" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="52" font-weight="800" letter-spacing="-2"><tspan fill="rgba(255,255,255,0.9)">adoptent l'IA </tspan><tspan fill="#EA580C">plus vite</tspan></text>
  <text x="52" y="334" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="52" font-weight="800" letter-spacing="-2"><tspan fill="rgba(255,255,255,0.55)">qu'on ne le croit</tspan></text>
  <text x="52" y="396" font-family="'DM Sans', Arial, sans-serif" font-size="24" font-weight="300" fill="rgba(255,255,255,0.65)" letter-spacing="-0.3">La réalité terrain dans les Hauts-de-France, chiffres à l'appui</text>
  <line x1="52" y1="438" x2="600" y2="438" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="52" y="496" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="32" font-weight="800" fill="#EA580C">68%</text>
  <text x="52" y="526" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">pas encore automatisé</text>
  <text x="271" y="496" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="32" font-weight="800" fill="#EA580C">-73%</text>
  <text x="271" y="526" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">tâches répétitives</text>
  <text x="465" y="496" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="32" font-weight="800" fill="#EA580C">6 sem.</text>
  <text x="465" y="526" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">avant 1ers gains</text>
  <text x="643" y="496" font-family="'Plus Jakarta Sans', Arial Black, sans-serif" font-size="32" font-weight="800" fill="#EA580C">×3 ROI</text>
  <text x="643" y="526" font-family="'DM Sans', Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">sur 12 mois</text>
  <text x="1148" y="590" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.35)" text-anchor="end">dunai.fr</text>
  <circle cx="1100" cy="420" r="180" fill="#EA580C" opacity="0.06"/>
  <circle cx="1100" cy="420" r="120" fill="#EA580C" opacity="0.06"/>
  <circle cx="1100" cy="420" r="60" fill="#EA580C" opacity="0.08"/>
</svg>